schema_version = "1.0.0"

id = "audio_core_engine"
version = "0.5.0"
name = "Audio Core Engine"
tagline = "Drive Geometry Nodes and shaders from audio in real time"
maintainer = "Marius Viennot"
type = "add-on"

tags = ["Animation", "Geometry Nodes", "Node"]

# Needs 5.2: driven values read modifier inputs through NodesModifier.properties.
blender_version_min = "5.2.0"

# Placeholder until the license is chosen.
license = ["SPDX:LicenseRef-Proprietary"]

platforms = ["windows-x64", "macos-arm64", "linux-x64"]

# Written by tools/fetch_wheels.py from tools/wheels.txt; do not edit by hand.
wheels = [
  "./wheels/audioflux-0.1.9+ace.1-py3-none-macosx_11_0_arm64.whl",
  "./wheels/audioflux-0.1.9+ace.1-py3-none-manylinux_2_17_x86_64.whl",
  "./wheels/audioflux-0.1.9+ace.1-py3-none-win_amd64.whl",
  "./wheels/cffi-2.0.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/cffi-2.0.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/cffi-2.0.0-cp313-cp313-win_amd64.whl",
  "./wheels/llvmlite-0.46.0-cp313-cp313-macosx_12_0_arm64.whl",
  "./wheels/llvmlite-0.46.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/llvmlite-0.46.0-cp313-cp313-win_amd64.whl",
  "./wheels/numba-0.63.1-cp313-cp313-macosx_12_0_arm64.whl",
  "./wheels/numba-0.63.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/numba-0.63.1-cp313-cp313-win_amd64.whl",
  "./wheels/pycparser-2.23-py3-none-any.whl",
  "./wheels/sounddevice-0.5.5-py3-none-macosx_10_6_x86_64.macosx_10_6_universal2.whl",
  "./wheels/sounddevice-0.5.5-py3-none-manylinux_2_28_x86_64.whl",
  "./wheels/sounddevice-0.5.5-py3-none-win_amd64.whl",
]

[permissions]
files = "Read audio files from disk"
network = "Receive live audio over UDP"
microphone = "Capture live audio from input devices"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "/.github/",
  "/.vscode/",
  "/.ruff_cache/",
  "/.gitignore",
  "/_vendor/",
  "/tests/",
  "/tools/",
  "/dist/",
  "/pyproject.toml",
  "/AI_Code_Review.md",
  "/FUTURE.md",
  "/CLAUDE.md",
]
