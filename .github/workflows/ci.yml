name: ACE CI

# Pull requests run everything. A push runs only lint and the minimal unit tests, and
# runs nothing when the branch has an open pull request, since that run covers it.
# Run the workflow by hand (Actions tab) to get every job on any branch.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch or pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Blender 5.2 runs Python 3.13 and bundles NumPy 2.3.4; tests outside Blender use the same.
  PYTHON_VERSION: "3.13"
  NUMPY_VERSION: "2.3.4"
  BLENDER_VERSION: "5.2.0"

jobs:
  open-pr:
    # On a push, finds whether the branch has an open pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the lookup fails, count it as no pull request so the push still gets tested.
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length) || n=0
          if [ "${n:-0}" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

  tests:
    needs: open-pr
    # Runs unless this is a push to a branch whose open pull request already runs it.
    if: ${{ !cancelled() && needs.open-pr.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimal: NumPy only, the fallbacks ACE uses when no optional library loads.
        # bundled: the Linux wheels the extension ships (tools/wheels.txt), not run on a push.
        deps: ${{ fromJSON(github.event_name == 'push' && '["minimal"]' || '["minimal", "bundled"]') }}
    # Perf gates are skipped here (no ACE_PERF); they run in the perf job below.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==${NUMPY_VERSION}"
          if [ "${{ matrix.deps }}" = "bundled" ]; then
            python tools/fetch_wheels.py --platform linux-x64 --no-manifest
            pip install --no-deps wheels/*.whl
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run each test file on its own
        # Catches tests that only pass because another file set up shared state.
        if: github.event_name != 'push'
        working-directory: tests
        run: |
          status=0
          for f in test_*.py; do
            python -m unittest "${f%.py}" || { echo "::error::${f} fails on its own"; status=1; }
          done
          exit $status

  lint:
    needs: open-pr
    if: ${{ !cancelled() && needs.open-pr.outputs.found != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  perf:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      ACE_PERF: "1"
      ACE_PERF_GATE_STRICT: "1"
      ACE_ENGINE_PERF_GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install NumPy and the bundled wheels
        run: |
          pip install "numpy==${NUMPY_VERSION}"
          python tools/fetch_wheels.py --platform linux-x64 --no-manifest
          pip install --no-deps wheels/*.whl
      - name: Strict perf gates
        working-directory: tests
        run: python -m unittest test_engine_perf_gate test_perf_gate -v

  blender:
    # The extension as users install it: built for Linux, installed with its wheels, run headless.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Libraries headless Blender needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsm6 libice6 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -sSfL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C "$HOME"

      - name: Fetch the wheels
        run: python tools/fetch_wheels.py

      - name: Manifest lists exactly the pinned wheels
        run: |
          git diff --exit-code blender_manifest.toml \
            || { echo "::error::blender_manifest.toml is out of date: run python tools/fetch_wheels.py and commit it"; exit 1; }

      - name: Smoke test (installed extension)
        run: python tests/run_in_blender.py --package --blender "$HOME/blender-${BLENDER_VERSION}-linux-x64/blender"

      - name: Reference curves (installed extension)
        run: |
          python tests/run_in_blender.py --package --blender "$HOME/blender-${BLENDER_VERSION}-linux-x64/blender" \
            --script tests/reference/blender_reference.py

      - name: Drift report
        if: failure()
        run: python tests/reference/report.py || true

      - name: Upload reference artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reference-curves
          path: tests/artifacts/reference/
          if-no-files-found: ignore

  reference-crosscheck:
    # The committed curves against independent tools (librosa, pyloudnorm). No Blender.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the tools
        run: |
          pip install "numpy==${NUMPY_VERSION}"
          pip install -r tests/requirements-reference.txt
      - name: Coverage and cross-checks
        working-directory: tests
        run: python -m unittest test_reference_goldens test_reference_crosscheck -v
