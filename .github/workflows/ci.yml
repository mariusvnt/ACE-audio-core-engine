name: ACE CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimal: the fallbacks users get before installing dependencies.
        # full: what the add-on's dependency installer provides.
        deps: [minimal, full]
    # Perf gates are skipped here (no ACE_PERF); they run in the perf job below.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Blender 5.x bundles Python 3.11.
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "full" ]; then
            pip install numpy scipy soundfile numba audioflux
          else
            pip install numpy
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run each test file on its own
        # Catches tests that only pass because another file set up shared state.
        working-directory: tests
        run: |
          status=0
          for f in test_*.py; do
            python -m unittest "${f%.py}" || { echo "::error::${f} fails on its own"; status=1; }
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  perf:
    runs-on: ubuntu-latest
    env:
      ACE_PERF: "1"
      ACE_PERF_GATE_STRICT: "1"
      ACE_ENGINE_PERF_GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install numpy scipy soundfile numba audioflux
      - name: Strict perf gates
        working-directory: tests
        run: python -m unittest test_engine_perf_gate test_perf_gate -v
