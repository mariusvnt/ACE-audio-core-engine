name: ACE CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ACE_PERF_GATE_STRICT: "1"
      ACE_ENGINE_PERF_GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests
